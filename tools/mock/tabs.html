<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Several tabs</title></head>
<body>
<!-- Opens n copies of the mock page that share localStorage, like several Torn tabs. Query: n=<tabs>, q=<mock query>,
     vis<i>=hidden|visible|focus, mute<i>=1, close<i>=<ms> to close tab i, stagger=<ms between opens>. The totals land in data-tabs. -->
<script>
const P = new URLSearchParams(location.search), n = +P.get("n") || 1, stagger = +P.get("stagger") || 300;
localStorage.clear();
const frames = [];
for (let i = 0; i < n; i++) setTimeout(() => {
  const f = document.createElement("iframe");
  f.style.cssText = "width:500px;height:400px;border:0";
  f.src = "torn.html?" + (P.get("q") || "") + "&tab=" + i + (P.get("vis" + i) ? "&vis=" + P.get("vis" + i) : "") + (P.get("mute" + i) ? "&mute=1" : "");
  document.body.appendChild(f); frames[i] = f;
  if (P.get("close" + i)) setTimeout(() => f.remove(), +P.get("close" + i));
}, i * stagger);
setInterval(() => {
  const sounds = [], feed = [];
  for (let i = 0; i < n; i++) { sounds.push(+localStorage.getItem("mock:snd:" + i) || 0); feed.push(+localStorage.getItem("mock:feed:" + i) || 0); }
  document.body.dataset.tabs = JSON.stringify({ freq: localStorage.getItem("mock:freq:0"), sounds, feed, total: sounds.reduce((a, b) => a + b, 0), feeds: feed.reduce((a, b) => a + b, 0) });
}, 200);
</script>
</body>
</html>
